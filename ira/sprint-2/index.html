<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sprint 2 Homework</title>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first app. Fixed header with progress, one task per page in the middle, Back/Next bar at the bottom.
   Word banks, audio and starters are sticky inside their page, so the words are always on screen while she answers. */
:root{
  --canvas:#F3F4F7; --panel:#FFFFFF; --ink:#151823; --ink-2:#4A5063; --muted:#7C8296; --line:#E2E4EB; --line-2:#EDEEF3;
  --signal:#FF5A1F; --signal-soft:#FFE8DF; --signal-ink:#B83A0C;
  --doing:#C98800; --doing-soft:#FFF4DA; --done:#1F9D63; --done-soft:#E1F5EA; --block:#E0364F; --block-soft:#FDE6EA;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0F1117; --panel:#171A23; --ink:#ECEEF4; --ink-2:#B4B9C9; --muted:#8B91A5; --line:#2A2E3B; --line-2:#222632;
  --signal:#FF6B33; --signal-soft:#3A1E14; --signal-ink:#FFB194; --doing:#F0B33A; --doing-soft:#3A2E12; --done:#3CC283; --done-soft:#123323; --block:#FF5E73; --block-soft:#3A1720; color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#0F1117; --panel:#171A23; --ink:#ECEEF4; --ink-2:#B4B9C9; --muted:#8B91A5; --line:#2A2E3B; --line-2:#222632;
  --signal:#FF6B33; --signal-soft:#3A1E14; --signal-ink:#FFB194; --doing:#F0B33A; --doing-soft:#3A2E12; --done:#3CC283; --done-soft:#123323; --block:#FF5E73; --block-soft:#3A1720; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em}

.app{height:100%;max-width:600px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--canvas)}
@media (min-width:640px){body{padding-block:16px}.app{height:calc(100% - 32px);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(21,24,35,.12)}}

/* header */
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;gap:8px}
.top-row{display:flex;align-items:center;gap:10px}
.logo{width:24px;height:24px;border-radius:7px;background:var(--ink);display:grid;place-items:center;flex:none}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--signal)}
.tid{color:var(--muted)}
.ttl{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.count{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{display:grid;grid-auto-flow:column;gap:3px}
.bar i{height:4px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--signal)}
.bar i.ok{background:var(--ink)}

/* pages */
.pages{overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.page{padding:18px 16px 28px;display:grid;gap:14px;align-content:start}
.page h2{font-size:26px;line-height:1.1;letter-spacing:-.02em;font-weight:700}
.lead{color:var(--ink-2);font-size:15.5px}
.lead b{color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.stick{position:sticky;top:0;z-index:5;margin-inline:-16px;padding:10px 16px;background:var(--canvas);border-bottom:1px solid var(--line)}
.stick .label{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}

/* bottom nav */
.nav{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.nav button{min-height:50px;border-radius:14px;font-weight:700;font-size:16px}
.back{flex:0 0 auto;padding-inline:18px;border:1px solid var(--line);background:var(--panel)}
.next{flex:1;border:none;background:var(--ink);color:var(--panel)}
.next.go{background:var(--signal);color:#fff}

/* start */
.hero{display:grid;gap:10px;padding-top:6px}
.hero h1{font-size:44px;line-height:.95;letter-spacing:-.04em;font-weight:800}
.hero h1 em{font-style:normal;color:var(--signal)}
.list{display:grid;gap:6px;padding:12px 14px}
.list div{display:flex;gap:10px;align-items:center;font-size:15px}
.list .mono{color:var(--muted);min-width:56px}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:14.5px}
input.name{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 14px}

/* match */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:8px}
.mcol{display:grid;gap:8px;align-content:start}
.m{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 11px;text-align:left;font-size:14.5px;line-height:1.3;min-height:58px;transition:background .15s,border-color .15s}
.m.w{font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.m.sel{border-color:var(--signal);background:var(--signal-soft)}
.m.done{background:var(--done-soft);border-color:var(--done);color:var(--ink-2);cursor:default}
.m.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.say{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--canvas);display:grid;place-items:center;flex:none}
.say svg{width:13px;height:13px}
.say.playing{background:var(--signal);border-color:var(--signal);color:#fff}

/* chips / bank */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ink-2);background:var(--panel);border-radius:9px;padding:7px 11px;font-size:15px;font-weight:600}
.chip.used{opacity:.35;text-decoration:line-through;border-color:var(--line)}
.chip.bad{animation:shake .35s}

/* gap sentences */
.gaps{display:grid;gap:8px}
.gs{padding:12px 14px;font-size:16px;line-height:1.7}
.gs .n{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:6px}
.gap{display:inline-block;min-width:92px;border:none;border-bottom:2px dashed var(--muted);background:transparent;padding:0 6px;font-weight:700;text-align:center;border-radius:4px 4px 0 0}
.gap.sel{background:var(--signal-soft);border-bottom-color:var(--signal)}
.gap.ok{border-bottom:2px solid var(--done);color:var(--done)}

/* player */
.player{display:flex;align-items:center;gap:12px;padding:10px 12px}
.pbtn{width:46px;height:46px;border-radius:50%;border:none;background:var(--ink);color:var(--panel);font-size:16px;flex:none}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:36px;min-width:0}
.wave i{flex:1;border-radius:2px;background:var(--line)}
.wave i.on{background:var(--signal)}
.ptime{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ptools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:13.5px;font-weight:600}
.sbtn.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.script{display:grid;gap:5px;font-size:14.5px;padding:12px 14px}

/* mcq */
.qs{display:grid;gap:8px}
.q{padding:12px 14px;display:grid;gap:8px}
.q p{font-weight:600}
.q .slot{display:inline-block;min-width:70px;border-bottom:2px dashed var(--muted);text-align:center}
.q.done .slot{border-bottom-color:var(--done);color:var(--done);font-weight:700}
.opts{display:grid;gap:6px}
.opt{border:1px solid var(--line);background:var(--canvas);border-radius:10px;padding:10px 12px;text-align:left;font-size:15px;min-height:44px}
.opt.right{background:var(--done-soft);border-color:var(--done);color:var(--done);font-weight:600}
.opt.wrong{background:var(--block-soft);border-color:var(--block);color:var(--block);text-decoration:line-through}
.fb{font-size:13.5px;color:var(--muted)}
.rule{padding:12px 14px;display:grid;gap:6px;font-size:14.5px}
.rule .f{font-family:var(--mono);font-size:13.5px;background:var(--canvas);border-radius:8px;padding:8px 10px}
.rule .f b{color:var(--signal-ink)}
.rule em{font-style:normal;font-weight:700}

/* order */
.ord{padding:12px 14px;display:grid;gap:10px}
.ord .hint{font-size:14px;color:var(--muted)}
.built{min-height:48px;border:1.5px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.built:empty::before{content:"Tap the words in order";color:var(--muted);font-size:14px}
.built .chip{border-color:var(--signal)}
.ord.done .built{border-style:solid;border-color:var(--done);background:var(--done-soft)}
.ord.done .built .chip{border-color:var(--done)}
.ord .row{display:flex;gap:8px;align-items:center}
.ord .msg{font-size:13.5px;font-weight:600}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.col{background:var(--line-2);border-radius:10px;padding:6px;display:grid;gap:5px;align-content:start}
.col h3{font-size:11.5px;font-family:var(--mono);font-weight:600;padding:2px 2px 0;display:flex;align-items:center;gap:5px}
.col h3::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-todo{color:var(--muted)}.c-doing{color:var(--doing)}.c-done{color:var(--done)}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 7px;font-size:12.5px;line-height:1.25;font-weight:600}
.starters{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.starters span{font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:3px 7px}
textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:150px;resize:vertical}
.wc{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}

/* backlog */
.bl{display:grid;gap:6px}
.bi{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 12px;text-align:left;font-size:15px;font-weight:600}
.rk{width:26px;height:26px;border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.bi.on{border-color:var(--signal);background:var(--signal-soft)}
.bi.on .rk{background:var(--signal);border:none;color:#fff}

/* situation */
.alert{display:flex;gap:10px;background:var(--block-soft);color:var(--block);border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px}
.phr{display:grid;gap:4px;font-size:13.5px}
.phr span{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:3px 8px}

/* finish */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--mono);font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.pill b{color:var(--ink)}
.big{border:none;background:var(--signal);color:#fff;border-radius:14px;min-height:54px;font-size:17px;font-weight:800}
.note{font-weight:600}
.copybox{min-height:180px;font-size:13.5px;font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="top-row"><span class="logo" aria-hidden="true"><i></i></span><span class="mono tid" id="tid">HW-2</span><span class="ttl" id="ttl"></span><span class="mono count" id="count"></span></div>
    <div class="bar" id="bar" aria-hidden="true"></div>
  </header>
  <main class="pages" id="pages"></main>
  <nav class="nav">
    <button type="button" class="back" id="back">Back</button>
    <button type="button" class="next" id="next">Next</button>
  </nav>
</div>

  function matchPage(pg,start){

    const set=W.slice(start,start+6).map((w,k)=>({w:w[0],d:w[1],i:start+k}));

    set.forEach(x=>{ const b=document.createElement('button'); b.type='button'; b.className='m w'; b.dataset.i=x.i;
      b.innerHTML=`<span>${x.w}</span><span class="say" role="button" tabindex="0" aria-label="Listen: ${x.w}">${SPK}</span>`;

    const bank=pg.querySelector('#bank');
    const used=()=>Object.keys(st.gaps).filter(k=>st.gaps[k].ok).map(k=>GAPS[k][1]);

        if(w===ans){ st.gaps[i].ok=true; gapEls[i].textContent=ans; gapEls[i].classList.add('ok'); c.classList.add('used'); autoSel(); }

  function mcq(box, items, store, gram){
    items.forEach((q,i)=>{
      const d=document.createElement('div'); d.className='card q';
      d.innerHTML=`<p>${esc(q.t).replace('___','<span class="slot">&nbsp;</span>')}</p><div class="opts"></div><p class="fb" hidden></p>`;
      const ob=d.querySelector('.opts'), fb=d.querySelector('.fb'), slot=d.querySelector('.slot');
      const order=q.o.map((_,k)=>k); for(let k=order.length-1;k>0;k--){ const j=(i*5+k*3+1)%(k+1); [order[k],order[j]]=[order[j],order[k]]; }
      const btns=[];
      const solve=()=>{ d.classList.add('done'); if(slot) slot.textContent=q.o[0]; if(q.f){ fb.hidden=false; fb.textContent=q.f; } btns.forEach(b=>{ if(b.dataset.k==='0') b.classList.add('right'); }); };
      order.forEach(k=>{ const b=document.createElement('button'); b.type='button'; b.className='opt'; b.textContent=q.o[k]; b.dataset.k=k; btns.push(b);
        b.addEventListener('click',()=>{ if(d.classList.contains('done')) return;
          if(!store[i]) store[i]={first:q.o[k],ok:false};
          if(k===0){ store[i].ok=true; solve(); } else b.classList.add('wrong'); save(); });
        ob.appendChild(b); });
      if(store[i]&&store[i].ok) solve();
      box.appendChild(d);
    });
  }

  function pOrder(pg){
    head(pg,'Build the sentence','Tap the words in the right order. Tap a word in your sentence to remove it.');
    ORD.forEach((ws,i)=>{
      const d=document.createElement('div'); d.className='card ord';
      d.innerHTML=`<div class="built"></div><div class="chips"></div><div class="row"><button type="button" class="sbtn">Clear</button><span class="msg"></span></div>`;
      const built=d.querySelector('.built'), pool=d.querySelector('.chips'), msg=d.querySelector('.msg');
      const shuffled=ws.map((w,k)=>({w,k})); for(let k=shuffled.length-1;k>0;k--){ const j=(i*7+k*5+2)%(k+1); [shuffled[k],shuffled[j]]=[shuffled[j],shuffled[k]]; }
      if(shuffled.every((x,k)=>x.k===k)) shuffled.push(shuffled.shift());
      const rec=st.ord[i]||(st.ord[i]={tries:0,ok:false});
      const mk=x=>{ const c=document.createElement('button'); c.type='button'; c.className='chip'; c.textContent=x.w; c._x=x; return c; };
      function check(){ if(built.children.length!==ws.length){ msg.textContent=''; return; }
        const s=[...built.children].map(c=>c.textContent).join(' ');
        if(s===ws.join(' ')){ rec.ok=true; d.classList.add('done'); msg.textContent='Correct!'; msg.style.color='var(--done)'; }
        else { rec.tries++; msg.textContent='Not quite. Try again.'; msg.style.color='var(--block)'; }
        save(); }
      shuffled.forEach(x=>{ const c=mk(x); pool.appendChild(c);
        c.addEventListener('click',()=>{ if(d.classList.contains('done')) return; (c.parentElement===pool?built:pool).appendChild(c); check(); }); });
      d.querySelector('.sbtn').addEventListener('click',()=>{ if(d.classList.contains('done')) return; [...built.children].forEach(c=>pool.appendChild(c)); msg.textContent=''; });
      if(rec.ok){ ws.forEach(w=>{ const c=[...pool.children].find(x=>x.textContent===w&&x.parentElement===pool); if(c) built.appendChild(c); }); d.classList.add('done'); msg.textContent='Correct!'; msg.style.color='var(--done)'; }
      pg.appendChild(d);
    });
  }

  function writeBox(pg,key,ph){
    const t=document.createElement('textarea'); t.placeholder=ph; t.value=st[key]||''; t.setAttribute('aria-label','Your answer');
    const wc=document.createElement('p'); wc.className='wc';
    const cnt=()=>{ wc.textContent=((t.value.trim().match(/\S+/g)||[]).length)+' words'; };
    t.addEventListener('input',()=>{ st[key]=t.value.slice(0,4000); cnt(); save(); }); cnt();
    pg.appendChild(t); pg.appendChild(wc);
  }

  function pUpdate(pg){
    pg.insertAdjacentHTML('beforeend',`<div class="stick"><p class="label">Team board</p><div class="board">
      <div class="col"><h3 class="c-todo">TO DO</h3><span class="tk">Loyalty programme</span><span class="tk">New filters</span></div>
      <div class="col"><h3 class="c-doing">IN PROGRESS</h3><span class="tk">Arabic website</span><span class="tk">Mobile checkout</span></div>
      <div class="col"><h3 class="c-done">DONE</h3><span class="tk">Size chart for jeans</span><span class="tk">Winter photos</span></div></div>
      <div class="starters"><span>We've already…</span><span>We've just…</span><span>We're working on…</span><span>We haven't … yet.</span></div></div>`);
    head(pg,'Status update','Your manager asks: <b>“Where are we with everything?”</b> Write 5–6 sentences about the board. Use the Present Perfect.');
    writeBox(pg,'update','Hi Tom, a quick update. We\'ve already…');
  }

  function pBacklog(pg){
    head(pg,'Backlog','You have one developer for the next sprint. Tap your <b>top 3</b> in order. Then explain why.');
    const box=document.createElement('div'); box.className='bl'; pg.appendChild(box);
    const rows=BL.map((t,i)=>{ const b=document.createElement('button'); b.type='button'; b.className='bi'; b.innerHTML=`<span class="rk"></span><span>${esc(t)}</span>`;
      b.addEventListener('click',()=>{ const k=st.prio.indexOf(i); if(k>-1) st.prio.splice(k,1); else if(st.prio.length<3) st.prio.push(i); draw(); save(); });
      box.appendChild(b); return b; });
    function draw(){ rows.forEach((r,i)=>{ const k=st.prio.indexOf(i); r.classList.toggle('on',k>-1); r.setAttribute('aria-pressed',k>-1); r.querySelector('.rk').textContent=k>-1?k+1:''; }); }
    draw();
    pg.insertAdjacentHTML('beforeend',`<p class="lead"><b>Why?</b> Start with: <i>My top priority is … because…</i> and <i>… can wait until…</i></p>`);
    writeBox(pg,'why','My top priority is… because…');
  }

  function pMsg(pg){
    pg.insertAdjacentHTML('beforeend',`<div class="stick"><p class="label">Useful phrases</p><div class="phr">
      <span>We're a bit behind on…</span><span>The launch is now scheduled for…</span><span>I see your point, but…</span><span>What if we… instead?</span><span>Can we find a middle ground?</span></div></div>`);
    head(pg,'The launch is late','');
    pg.insertAdjacentHTML('beforeend',`<div class="alert"><span aria-hidden="true">●</span><span>The stock for the men's autumn collection hasn't arrived. You can't launch on Friday.</span></div>
      <p class="lead">The Head of Marketing has already paid for ads in Dubai Mall. Write her a message (5–6 sentences): give an update, give the new date and suggest a plan.</p>`);
    writeBox(pg,'msg','Hi Sarah, I have some news about the launch…');
  }

  /* ---------- finish ---------- */
  const okCount=o=>Object.values(o).filter(x=>x.ok&&x.first!==undefined).length;
  const firstOk=(o,items,ansOf)=>items.map((_,i)=>o[i]&&o[i].first===ansOf(i)).filter(Boolean).length;
  function asText(){
    const L=[`Homework Sprint 2 from Ira — ${new Date().toLocaleString('en-GB')}`,''];
    L.push(`PRODUCT WORDS: ${st.match.done.length}/12 matched, ${st.match.miss} mistakes`,'');
    L.push(`USE THE WORDS: ${firstOk(st.gaps,GAPS,i=>GAPS[i][1])}/${GAPS.length} right first time`);
    GAPS.forEach(([s,a],i)=>{ const r=st.gaps[i]; L.push(`${i+1}. ${r?(r.first===a?'✓':'✗ '+r.first+' →'):'– (no answer)'} ${s.replace('___',a)}`); }); L.push('');
    const block=(title,items,store)=>{ L.push(`${title}: ${firstOk(store,items,i=>items[i].o[0])}/${items.length} right first time`);
      items.forEach((q,i)=>{ const r=store[i]; L.push(`${i+1}. ${r?(r.first===q.o[0]?'✓':'✗ '+r.first+' →'):'– (no answer)'} ${q.t.replace('___',q.o[0])}${q.t.includes('___')?'':' — '+q.o[0]}`); }); L.push(''); };
    block('LISTENING',LQ,st.listen); block('PRESENT PERFECT',GQ,st.gram);
    L.push(`BUILD THE SENTENCE: ${ORD.filter((_,i)=>st.ord[i]&&st.ord[i].ok).length}/${ORD.length} done`);
    ORD.forEach((w,i)=>{ const r=st.ord[i]; L.push(`${i+1}. ${r&&r.ok?'✓':'–'} ${w.join(' ')}${r&&r.tries?` (${r.tries} wrong tries)`:''}`); }); L.push('');
    L.push('STATUS UPDATE:',st.update.trim()||'(empty)','');
    L.push('BACKLOG TOP 3: '+(st.prio.length?st.prio.map((k,i)=>`${i+1}) ${BL[k]}`).join('  '):'(not chosen)'),st.why.trim()||'(no explanation)','');
    L.push('MESSAGE TO MARKETING:',st.msg.trim()||'(empty)');
    return L.join('\n');
  }
  function pFinish(pg){
    const lf=firstOk(st.listen,LQ,i=>LQ[i].o[0]), gf=firstOk(st.gram,GQ,i=>GQ[i].o[0]), wf=firstOk(st.gaps,GAPS,i=>GAPS[i][1]);
    pg.innerHTML=`<div class="hero"><span class="mono" style="color:var(--done)">SHIPPED</span><h1>Great work, Ira!</h1></div>
      <div class="pills"><span class="pill">Words <b>${st.match.done.length}/12</b></span><span class="pill">Gaps <b>${wf}/8</b></span><span class="pill">Listening <b>${lf}/6</b></span><span class="pill">Grammar <b>${gf}/8</b></span><span class="pill">Sentences <b>${ORD.filter((_,i)=>st.ord[i]&&st.ord[i].ok).length}/5</b></span></div>
      <p class="lead">Last step: copy your answers and send them to Tanya in a message.</p>
      <button type="button" class="big" id="copy">Copy my answers</button><p class="note" id="cnote" aria-live="polite"></p>
      <textarea class="copybox" id="cbox" readonly aria-label="Your answers"></textarea>
      <button type="button" class="sbtn" id="reset" style="justify-self:start">Start again</button>`;
    const box=pg.querySelector('#cbox'); box.value=asText();
    pg.querySelector('#copy').addEventListener('click',async e=>{ try{ await navigator.clipboard.writeText(box.value); e.currentTarget.textContent='Copied ✓'; pg.querySelector('#cnote').textContent='Now paste it into your chat with Tanya.'; }
      catch(_){ box.focus(); box.select(); try{ box.setSelectionRange(0,box.value.length); }catch(__){} pg.querySelector('#cnote').textContent='The text is selected. Tap “Copy”, then paste it into your chat with Tanya.'; } });
    let armed=false; pg.querySelector('#reset').addEventListener('click',e=>{ if(!armed){ armed=true; e.currentTarget.textContent='Tap again to delete all answers'; return; }
      try{ localStorage.removeItem(KEY); }catch(_){} st={page:0,match:{done:[],miss:0},gaps:{},listen:{},gram:{},ord:{},update:'',prio:[],why:'',msg:''}; save(); render(); });
  }

  render();
})();
</script>

</body>
</html>
