<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>What If Homework</title>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first app. Fixed header with progress, one task per page in the middle, Back/Next bar at the bottom.
   Word banks, audio and starters are sticky inside their page, so the words are always on screen while she answers. */
:root{
  --canvas:#F3F4F7; --panel:#FFFFFF; --ink:#151823; --ink-2:#4A5063; --muted:#7C8296; --line:#E2E4EB; --line-2:#EDEEF3;
  --signal:#FF5A1F; --signal-soft:#FFE8DF; --signal-ink:#B83A0C;
  --doing:#C98800; --doing-soft:#FFF4DA; --done:#1F9D63; --done-soft:#E1F5EA; --block:#E0364F; --block-soft:#FDE6EA;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0F1117; --panel:#171A23; --ink:#ECEEF4; --ink-2:#B4B9C9; --muted:#8B91A5; --line:#2A2E3B; --line-2:#222632;
  --signal:#FF6B33; --signal-soft:#3A1E14; --signal-ink:#FFB194; --doing:#F0B33A; --doing-soft:#3A2E12; --done:#3CC283; --done-soft:#123323; --block:#FF5E73; --block-soft:#3A1720; color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#0F1117; --panel:#171A23; --ink:#ECEEF4; --ink-2:#B4B9C9; --muted:#8B91A5; --line:#2A2E3B; --line-2:#222632;
  --signal:#FF6B33; --signal-soft:#3A1E14; --signal-ink:#FFB194; --doing:#F0B33A; --doing-soft:#3A2E12; --done:#3CC283; --done-soft:#123323; --block:#FF5E73; --block-soft:#3A1720; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em}

.app{height:100%;max-width:600px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--canvas)}
@media (min-width:640px){body{padding-block:16px}.app{height:calc(100% - 32px);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(21,24,35,.12)}}

/* header */
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px 10px;display:grid;gap:8px}
.top-row{display:flex;align-items:center;gap:10px}
.logo{width:24px;height:24px;border-radius:7px;background:var(--ink);display:grid;place-items:center;flex:none}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--signal)}
.tid{color:var(--muted)}
.ttl{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.count{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{display:grid;grid-auto-flow:column;gap:3px}
.bar i{height:4px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--signal)}
.bar i.ok{background:var(--ink)}

/* pages */
.pages{overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.page{padding:18px 16px 28px;display:grid;gap:14px;align-content:start}
.page h2{font-size:26px;line-height:1.1;letter-spacing:-.02em;font-weight:700}
.lead{color:var(--ink-2);font-size:15.5px}
.lead b{color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.stick{position:sticky;top:0;z-index:5;margin-inline:-16px;padding:10px 16px;background:var(--canvas);border-bottom:1px solid var(--line)}
.stick .label{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}

/* bottom nav */
.nav{background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.nav button{min-height:50px;border-radius:14px;font-weight:700;font-size:16px}
.back{flex:0 0 auto;padding-inline:18px;border:1px solid var(--line);background:var(--panel)}
.next{flex:1;border:none;background:var(--ink);color:var(--panel)}
.next.go{background:var(--signal);color:#fff}

/* start */
.hero{display:grid;gap:10px;padding-top:6px}
.hero h1{font-size:44px;line-height:.95;letter-spacing:-.04em;font-weight:800}
.hero h1 em{font-style:normal;color:var(--signal)}
.list{display:grid;gap:6px;padding:12px 14px}
.list div{display:flex;gap:10px;align-items:center;font-size:15px}
.list .mono{color:var(--muted);min-width:56px}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:14.5px}
input.name{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 14px}

/* match */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:8px}
.mcol{display:grid;gap:8px;align-content:start}
.m{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 11px;text-align:left;font-size:14.5px;line-height:1.3;min-height:58px;transition:background .15s,border-color .15s}
.m.w{font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.m.sel{border-color:var(--signal);background:var(--signal-soft)}
.m.done{background:var(--done-soft);border-color:var(--done);color:var(--ink-2);cursor:default}
.m.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.say{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--canvas);display:grid;place-items:center;flex:none}
.say svg{width:13px;height:13px}
.say.playing{background:var(--signal);border-color:var(--signal);color:#fff}

/* chips / bank */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ink-2);background:var(--panel);border-radius:9px;padding:7px 11px;font-size:15px;font-weight:600}
.chip.used{opacity:.35;text-decoration:line-through;border-color:var(--line)}
.chip.bad{animation:shake .35s}

/* gap sentences */
.gaps{display:grid;gap:8px}
.gs{padding:12px 14px;font-size:16px;line-height:1.7}
.gs .n{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:6px}
.gap{display:inline-block;min-width:92px;border:none;border-bottom:2px dashed var(--muted);background:transparent;padding:0 6px;font-weight:700;text-align:center;border-radius:4px 4px 0 0}
.gap.sel{background:var(--signal-soft);border-bottom-color:var(--signal)}
.gap.ok{border-bottom:2px solid var(--done);color:var(--done)}

/* player */
.player{display:flex;align-items:center;gap:12px;padding:10px 12px}
.pbtn{width:46px;height:46px;border-radius:50%;border:none;background:var(--ink);color:var(--panel);font-size:16px;flex:none}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:36px;min-width:0}
.wave i{flex:1;border-radius:2px;background:var(--line)}
.wave i.on{background:var(--signal)}
.ptime{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ptools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:13.5px;font-weight:600}
.sbtn.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.script{display:grid;gap:5px;font-size:14.5px;padding:12px 14px}

/* mcq */
.qs{display:grid;gap:8px}
.q{padding:12px 14px;display:grid;gap:8px}
.q p{font-weight:600}
.q .slot{display:inline-block;min-width:70px;border-bottom:2px dashed var(--muted);text-align:center}
.q.done .slot{border-bottom-color:var(--done);color:var(--done);font-weight:700}
.opts{display:grid;gap:6px}
.opt{border:1px solid var(--line);background:var(--canvas);border-radius:10px;padding:10px 12px;text-align:left;font-size:15px;min-height:44px}
.opt.right{background:var(--done-soft);border-color:var(--done);color:var(--done);font-weight:600}
.opt.wrong{background:var(--block-soft);border-color:var(--block);color:var(--block);text-decoration:line-through}
.fb{font-size:13.5px;color:var(--muted)}
.rule{padding:12px 14px;display:grid;gap:6px;font-size:14.5px}
.rule .f{font-family:var(--mono);font-size:13.5px;background:var(--canvas);border-radius:8px;padding:8px 10px}
.rule .f b{color:var(--signal-ink)}
.rule em{font-style:normal;font-weight:700}

/* order */
.ord{padding:12px 14px;display:grid;gap:10px}
.ord .hint{font-size:14px;color:var(--muted)}
.built{min-height:48px;border:1.5px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.built:empty::before{content:"Tap the words in order";color:var(--muted);font-size:14px}
.built .chip{border-color:var(--signal)}
.ord.done .built{border-style:solid;border-color:var(--done);background:var(--done-soft)}
.ord.done .built .chip{border-color:var(--done)}
.ord .row{display:flex;gap:8px;align-items:center}
.ord .msg{font-size:13.5px;font-weight:600}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.col{background:var(--line-2);border-radius:10px;padding:6px;display:grid;gap:5px;align-content:start}
.col h3{font-size:11.5px;font-family:var(--mono);font-weight:600;padding:2px 2px 0;display:flex;align-items:center;gap:5px}
.col h3::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-todo{color:var(--muted)}.c-doing{color:var(--doing)}.c-done{color:var(--done)}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 7px;font-size:12.5px;line-height:1.25;font-weight:600}
.starters{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.starters span{font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:3px 7px}
textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:150px;resize:vertical}
.wc{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}

/* backlog */
.bl{display:grid;gap:6px}
.bi{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 12px;text-align:left;font-size:15px;font-weight:600}
.rk{width:26px;height:26px;border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.bi.on{border-color:var(--signal);background:var(--signal-soft)}
.bi.on .rk{background:var(--signal);border:none;color:#fff}

/* situation */
.alert{display:flex;gap:10px;background:var(--block-soft);color:var(--block);border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px}
.phr{display:grid;gap:4px;font-size:13.5px}
.phr span{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:3px 8px}

/* finish */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--mono);font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.pill b{color:var(--ink)}
.big{border:none;background:var(--signal);color:#fff;border-radius:14px;min-height:54px;font-size:17px;font-weight:800}
.note{font-weight:600}
.copybox{min-height:180px;font-size:13.5px;font-family:var(--mono)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.duo .opt{text-align:center;font-weight:600}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg{border-radius:12px;padding:10px 12px;font-size:14px;display:grid;gap:3px}
.lg b{font-family:var(--mono);font-size:12px}
.lg.a{background:var(--done-soft)}.lg.b{background:var(--signal-soft)}
.lg i{font-style:normal;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="top-row"><span class="logo" aria-hidden="true"><i></i></span><span class="mono tid" id="tid">HW-3</span><span class="ttl" id="ttl"></span><span class="mono count" id="count"></span></div>
    <div class="bar" id="bar" aria-hidden="true"></div>
  </header>
  <main class="pages" id="pages"></main>
  <nav class="nav">
    <button type="button" class="back" id="back">Back</button>
    <button type="button" class="next" id="next">Next</button>
  </nav>
</div>

  const LINES=[["Tom","Mia, is everything ready for the launch on Friday?"],["Mia","Almost. But if the stock doesn't arrive on Thursday, we'll start with pre-orders online."],["Tom","Good plan. And what if customers don't like the new jackets?"],["Mia","If the return rate is high, I'll talk to the design team. We'll fix the sizes for the next collection."],["Tom","OK. By the way, if you had a bigger budget, what would you do?"],["Mia","Hmm. If I had more money, I would hire a second photographer. And if I were the CEO, I would open a store in Japan!"],["Tom","Ha! Maybe one day. If you finish the report today, send it to me, please."],["Mia","Sure, I will."]];
  const LQ=[
    {t:"What will Mia do if the stock doesn't arrive on Thursday?",o:["start with pre-orders online","move the launch","call the warehouse"]},
    {t:"When will she talk to the design team?",o:["if the return rate is high","if the photos aren't ready","every Monday"]},
    {t:"What would Mia do with a bigger budget?",o:["hire a second photographer","buy new computers","open a new office"]},
    {t:"Where would she open a store if she were the CEO?",o:["in Japan","in Dubai","in London"]},
    {t:"Is the store in Japan a real plan?",o:["No, it's a dream.","Yes, next year.","Yes, on Friday."]},
    {t:"What should Mia do if she finishes the report today?",o:["send it to Tom","print it","present it on Friday"]}
  ];
  const C1=[
    {t:"If the photos ___ ready tomorrow, we'll upload them.",o:["are","will be","were"],f:"after if → present, not will"},
    {t:"If we launch late, customers ___ angry.",o:["will be","are","would be"]},
    {t:"I ___ you if I hear any news.",o:["'ll call","call","would call"]},
    {t:"If the website ___ fast, people won't buy.",o:["isn't","won't be","wasn't"]},
    {t:"What will you do if the stock ___?",o:["doesn't arrive","won't arrive","didn't arrive"]},
    {t:"If it rains on Saturday, we ___ the photo shoot.",o:["'ll move","move","would move"]}
  ];
  const C2=[
    {t:"If I ___ more time, I'd learn Japanese.",o:["had","have","would have"]},
    {t:"If we had a bigger budget, we ___ more people.",o:["would hire","will hire","hired"]},
    {t:"If I ___ you, I'd talk to the manager.",o:["were","am","will be"],f:"If I were you… = advice"},
    {t:"What would you do if you ___ the CEO?",o:["were","are","will be"]},
    {t:"If our prices were lower, we ___ more.",o:["would sell","will sell","sold"]},
    {t:"I ___ a new phone if it wasn't so expensive.",o:["'d buy","'ll buy","buy"]}
  ];
  const MATCH=[
    ["If the stock doesn't arrive,","we'll start with pre-orders."],
    ["If I were the CEO,","I'd give everyone Friday off."],
    ["If you send me the report,","I'll check it tonight."],
    ["If we had more developers,","we'd launch the app faster."],
    ["If customers complain,","we'll call them back."],
    ["If I spoke Arabic,","I'd chat with the Dubai team in Arabic."]
  ];
  const GAPS=[
    ["If the launch ___ well, we'll celebrate.","goes"],
    ["If I won a million dollars, I ___ my own brand.","would start"],
    ["We ___ the meeting if the manager is sick.","will cancel"],
    ["If I ___ in Paris, I'd go to fashion shows every week.","lived"],
    ["If the price ___ lower, more people would buy it.","were"],
    ["You ___ the train if you don't hurry!","will miss"],
    ["If we ___ the bug today, the app will work tomorrow.","fix"],
    ["If I had a free week, I ___ to the sea.","would go"]
  ];
  const BANK=["would go","will cancel","goes","were","fix","would start","will miss","lived"];
  const ORD=[
    ["If","the","stock","arrives,","we'll","launch","on","Friday."],
    ["If","I","were","you,","I'd","ask","the","boss."],
    ["What","would","you","do","if","you","had","more","time?"],
    ["I'll","call","you","if","I","have","news."]
  ];

  const P=[
    {id:'HW-3',t:'Start',r:pStart},
    {id:'IF-1',t:'Real or imaginary?',r:pSort},
    {id:'IF-2',t:'Listen: what if…?',r:pListen},
    {id:'IF-3',t:'First conditional',r:pg=>pMcq(pg,'First conditional','Real situations: it can really happen.',C1,st.c1,`<p class="f">If + present, … <b>will</b> + verb</p><p>If the stock <em>arrives</em>, we<em>'ll launch</em>. · No “will” after if!</p>`)},
    {id:'IF-4',t:'Second conditional',r:pg=>pMcq(pg,'Second conditional','Imaginary situations: dreams and advice.',C2,st.c2,`<p class="f">If + past, … <b>would</b> + verb</p><p>If I <em>had</em> more money, I<em>'d hire</em> a photographer. · If I <em>were</em> you, I<em>'d</em>…</p>`)},
    {id:'IF-5',t:'Match the halves',r:pMatch},
    {id:'IF-6',t:'Complete the sentences',r:pGaps},
    {id:'IF-7',t:'Build the sentence',r:pOrder},
    {id:'IF-8',t:'Plan B',r:pPlanB},
    {id:'IF-9',t:'Dream mode',r:pDream},
    {id:'DONE',t:'Send to Tanya',r:pFinish}
  ];
  const bar=$('bar'); P.forEach(()=>bar.appendChild(document.createElement('i')));
  function go(n){ stopAll(); st.page=Math.max(0,Math.min(P.length-1,n)); save(); render(); }
  function render(){
    const p=P[st.page]; $('tid').textContent=p.id; $('ttl').textContent=p.t; $('count').textContent=(st.page+1)+'/'+P.length;
    [...bar.children].forEach((b,i)=>{ b.className=i<st.page?'ok':i===st.page?'on':''; });
    const box=$('pages'); box.innerHTML=''; const pg=document.createElement('section'); pg.className='page'; box.appendChild(pg); box.scrollTop=0;
    p.r(pg);
    $('back').hidden=st.page===0;
    const nx=$('next'); nx.hidden=st.page===P.length-1; nx.textContent=st.page===0?'Start':st.page===P.length-2?'Finish':'Next'; nx.classList.toggle('go',st.page===0||st.page===P.length-2);
  }
  $('back').addEventListener('click',()=>go(st.page-1));
  $('next').addEventListener('click',()=>go(st.page+1));
  const head=(pg,t,l)=>pg.insertAdjacentHTML('beforeend',`<h2>${t}</h2>${l?`<p class="lead">${l}</p>`:''}`);
  const shake=el=>{ el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad'); };

  function pStart(pg){
    pg.innerHTML=`<div class="hero"><span class="mono" style="color:var(--signal-ink)">HOMEWORK · CONDITIONALS</span><h1>What <em>if</em>…?</h1>
      <p class="lead">Real plans and big dreams: the first and second conditional. Your answers save on this phone.</p></div>
      ${RULE}
      <div class="card list">${P.slice(1,-1).map(p=>`<div><span class="mono">${p.id}</span>${p.t}</div>`).join('')}</div>
      <div class="card list"><div><span class="mono">TIME</span>about 35 minutes · you can stop and come back</div></div>`;
  }

  function pSort(pg){
    pg.insertAdjacentHTML('beforeend',`<div class="stick">${RULE}</div>`);
    head(pg,'Real or imaginary?','Is it a real situation (1st) or an imaginary one (2nd)?');
    const box=document.createElement('div'); box.className='qs'; pg.appendChild(box);
    SORT.forEach(([s,ans],i)=>{
      const d=document.createElement('div'); d.className='card q'; d.innerHTML=`<p>${esc(s)}</p><div class="duo"></div>`;
      const duo=d.querySelector('.duo'); const btns=[];
      ['1st · real','2nd · imaginary'].forEach((lab,k)=>{ const b=document.createElement('button'); b.type='button'; b.className='opt'; b.textContent=lab; btns.push(b);
        b.addEventListener('click',()=>{ if(d.classList.contains('done')) return; if(!st.sort[i]) st.sort[i]={first:k,ok:false};
          if(k===ans){ st.sort[i].ok=true; d.classList.add('done'); b.classList.add('right'); } else b.classList.add('wrong'); save(); });
        duo.appendChild(b); });
      if(st.sort[i]&&st.sort[i].ok){ d.classList.add('done'); btns[ans].classList.add('right'); }
      box.appendChild(d); });
  }

  function mcq(box, items, store){
    items.forEach((q,i)=>{
      const d=document.createElement('div'); d.className='card q';
      d.innerHTML=`<p>${esc(q.t).replace('___','<span class="slot">&nbsp;</span>')}</p><div class="opts"></div><p class="fb" hidden></p>`;
      const ob=d.querySelector('.opts'), fb=d.querySelector('.fb'), slot=d.querySelector('.slot'); const btns=[];
      const order=q.o.map((_,k)=>k); for(let k=order.length-1;k>0;k--){ const j=(i*5+k*3+1)%(k+1); [order[k],order[j]]=[order[j],order[k]]; }
      const solve=()=>{ d.classList.add('done'); if(slot) slot.textContent=q.o[0].trim(); if(q.f){ fb.hidden=false; fb.textContent=q.f; } btns.forEach(b=>{ if(b.dataset.k==='0') b.classList.add('right'); }); };
      order.forEach(k=>{ const b=document.createElement('button'); b.type='button'; b.className='opt'; b.textContent=q.o[k]; b.dataset.k=k; btns.push(b);
        b.addEventListener('click',()=>{ if(d.classList.contains('done')) return; if(!store[i]) store[i]={first:q.o[k],ok:false};
          if(k===0){ store[i].ok=true; solve(); } else b.classList.add('wrong'); save(); });
        ob.appendChild(b); });
      if(store[i]&&store[i].ok) solve();
      box.appendChild(d); });
  }
  function pMcq(pg,title,lead,items,store,rule){
    pg.insertAdjacentHTML('beforeend',`<div class="stick"><div class="card rule">${rule}</div></div>`);
    head(pg,title,lead+' Choose the right form.');
    const qs=document.createElement('div'); qs.className='qs'; pg.appendChild(qs); mcq(qs,items,store);
  }

  function pListen(pg){
    pg.insertAdjacentHTML('beforeend',`<div class="stick"><div class="card player"><button type="button" class="pbtn" id="pbtn" aria-label="Play">▶</button><span class="wave" id="wave"></span><span class="ptime" id="ptime">0:00</span></div>
      <div class="ptools"><button type="button" class="sbtn" data-r="0.85">Slower</button><button type="button" class="sbtn on" data-r="1">Normal</button><button type="button" class="sbtn" id="sc" style="margin-left:auto">Transcript</button></div></div>`);
    head(pg,'Listen: what if…?','Tom and Mia talk about the launch. Listen and answer. You can listen many times.');
    pg.insertAdjacentHTML('beforeend',`<div class="card script" id="script" hidden>${LINES.map(([n,t])=>`<span><b>${n}:</b> ${esc(t)}</span>`).join('')}</div>`);
    const qs=document.createElement('div'); qs.className='qs'; pg.appendChild(qs); mcq(qs,LQ,st.listen);
    const wave=pg.querySelector('#wave'), bars=[]; for(let i=0;i<36;i++){ const b=document.createElement('i'); b.style.height=(6+Math.round(24*Math.abs(Math.sin(i*1.3)*Math.cos(i*.5))))+'px'; wave.appendChild(b); bars.push(b); }
    const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
    const paint=()=>{ const k=sa.duration?sa.currentTime/sa.duration:0; bars.forEach((b,j)=>b.classList.toggle('on',j/bars.length<k)); const t=pg.querySelector('#ptime'); if(t) t.textContent=fmt(sa.currentTime)+'/'+fmt(sa.duration); };
    sa.ontimeupdate=paint; sa.onloadedmetadata=paint; sa.onended=()=>{ const b=$('pbtn'); if(b) b.textContent='▶'; }; paint();
    pg.querySelector('#pbtn').addEventListener('click',e=>{ if(sa.paused){ sa.play().catch(()=>{}); e.currentTarget.textContent='❚❚'; } else { sa.pause(); e.currentTarget.textContent='▶'; } });
    wave.addEventListener('click',e=>{ if(!sa.duration) return; const r=wave.getBoundingClientRect(); sa.currentTime=sa.duration*(e.clientX-r.left)/r.width; paint(); });
    pg.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{ sa.playbackRate=+b.dataset.r; pg.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b)); }));
    pg.querySelector('#sc').addEventListener('click',e=>{ const s=pg.querySelector('#script'); s.hidden=!s.hidden; e.currentTarget.classList.toggle('on',!s.hidden); });
  }

  function pMatch(pg){
    head(pg,'Match the halves','Tap the beginning, then tap the right ending.');
    const g=document.createElement('div'); g.className='match'; g.style.gridTemplateColumns='1fr 1fr'; g.innerHTML='<div class="mcol"></div><div class="mcol"></div>'; pg.appendChild(g);
    const [L,R]=g.children; let sel=null;
    MATCH.forEach(([a],i)=>{ const b=document.createElement('button'); b.type='button'; b.className='m w'; b.style.fontSize='14.5px'; b.textContent=a; b.dataset.i=i;
      if(st.match.done.includes(i)) b.classList.add('done');
      b.addEventListener('click',()=>{ if(b.classList.contains('done')) return; L.querySelectorAll('.m').forEach(m=>m.classList.remove('sel')); sel=b; b.classList.add('sel'); });
      L.appendChild(b); });
    [2,0,5,3,1,4].forEach(i=>{ const b=document.createElement('button'); b.type='button'; b.className='m'; b.textContent=MATCH[i][1]; b.dataset.i=i;
      if(st.match.done.includes(i)) b.classList.add('done');
      b.addEventListener('click',()=>{ if(b.classList.contains('done')||!sel) return;
        if(sel.dataset.i===String(i)){ sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done'); st.match.done.push(i); sel=null; }
        else { st.match.miss++; shake(b); } save(); });
      R.appendChild(b); });
  }

  function pGaps(pg){
    pg.insertAdjacentHTML('beforeend',`<div class="stick"><p class="label">Verb bank · tap a gap, then a verb</p><div class="chips" id="bank"></div></div>`);
    head(pg,'Complete the sentences','Real or imaginary? Choose the right verb form from the bank.');
    const list=document.createElement('div'); list.className='gaps'; pg.appendChild(list);
    let selGap=null; const gapEls=[];
    GAPS.forEach(([s,ans],i)=>{ const d=document.createElement('div'); d.className='card gs'; const [a,b]=s.split('___');
      d.innerHTML=`<span class="n">${i+1}</span>${esc(a)}<button type="button" class="gap" aria-label="Gap ${i+1}">&nbsp;</button>${esc(b)}`;
      const g=d.querySelector('.gap'); gapEls.push(g);
      if(st.gaps[i]&&st.gaps[i].ok){ g.textContent=ans; g.classList.add('ok'); }
      g.addEventListener('click',()=>{ if(g.classList.contains('ok')) return; gapEls.forEach(x=>x.classList.remove('sel')); selGap=i; g.classList.add('sel'); });
      list.appendChild(d); });
    const used=()=>Object.keys(st.gaps).filter(k=>st.gaps[k].ok).map(k=>GAPS[k][1]);
    const autoSel=()=>{ const k=gapEls.findIndex(g=>!g.classList.contains('ok')); gapEls.forEach(x=>x.classList.remove('sel')); selGap=k>-1?k:null; if(k>-1) gapEls[k].classList.add('sel'); };
    const bank=pg.querySelector('#bank');
    BANK.forEach(w=>{ const c=document.createElement('button'); c.type='button'; c.className='chip'; c.textContent=w; if(used().includes(w)) c.classList.add('used');
      c.addEventListener('click',()=>{ if(c.classList.contains('used')||selGap===null) return; const i=selGap, ans=GAPS[i][1];
        if(!st.gaps[i]) st.gaps[i]={first:w,ok:false};
        if(w===ans){ st.gaps[i].ok=true; gapEls[i].textContent=ans; gapEls[i].classList.add('ok'); c.classList.add('used'); autoSel(); } else shake(c);
        save(); });
      bank.appendChild(c); });
    autoSel();
  }

  function pOrder(pg){
    head(pg,'Build the sentence','Tap the words in the right order. Tap a word in your sentence to remove it.');
    ORD.forEach((ws,i)=>{
      const d=document.createElement('div'); d.className='card ord';
      d.innerHTML=`<div class="built"></div><div class="chips"></div><div class="row"><button type="button" class="sbtn">Clear</button><span class="msg"></span></div>`;
      const built=d.querySelector('.built'), pool=d.querySelector('.chips'), msg=d.querySelector('.msg');
      const sh=ws.map((w,k)=>({w,k})); for(let k=sh.length-1;k>0;k--){ const j=(i*7+k*5+2)%(k+1); [sh[k],sh[j]]=[sh[j],sh[k]]; }
      if(sh.every((x,k)=>x.k===k)) sh.push(sh.shift());
      const rec=st.ord[i]||(st.ord[i]={tries:0,ok:false});
      const ok=()=>{ d.classList.add('done'); msg.textContent='Correct!'; msg.style.color='var(--done)'; };
      function check(){ if(built.children.length!==ws.length){ msg.textContent=''; return; }
        if([...built.children].map(c=>c.textContent).join(' ')===ws.join(' ')){ rec.ok=true; ok(); } else { rec.tries++; msg.textContent='Not quite. Try again.'; msg.style.color='var(--block)'; } save(); }
      sh.forEach(x=>{ const c=document.createElement('button'); c.type='button'; c.className='chip'; c.textContent=x.w; pool.appendChild(c);
        c.addEventListener('click',()=>{ if(d.classList.contains('done')) return; (c.parentElement===pool?built:pool).appendChild(c); check(); }); });
      d.querySelector('.sbtn').addEventListener('click',()=>{ if(d.classList.contains('done')) return; [...built.children].forEach(c=>pool.appendChild(c)); msg.textContent=''; });
      if(rec.ok){ ws.forEach(w=>{ const c=[...pool.children].find(x=>x.textContent===w); if(c) built.appendChild(c); }); ok(); }
      pg.appendChild(d); });
  }

  function writeBox(pg,key,ph){
    const t=document.createElement('textarea'); t.placeholder=ph; t.value=st[key]||''; t.setAttribute('aria-label','Your answer');
    const wc=document.createElement('p'); wc.className='wc'; const cnt=()=>{ wc.textContent=((t.value.trim().match(/\S+/g)||[]).length)+' words'; };
    t.addEventListener('input',()=>{ st[key]=t.value.slice(0,4000); cnt(); save(); }); cnt(); pg.appendChild(t); pg.appendChild(wc);
  }
  function pPlanB(pg){
    pg.insertAdjacentHTML('beforeend',`<div class="stick"><p class="label">Situations · 1st conditional</p><div class="phr">
      <span>1. The photographer is sick on the day of the photo shoot.</span><span>2. The website stops working on launch day.</span><span>3. A big customer is angry about a late order.</span></div>
      <div class="starters"><span>If the photographer is sick, I'll…</span><span>If …, we'll…</span><span>I'll call…</span></div></div>`);
    head(pg,'Plan B','Things can go wrong! What <b>will</b> you do? Write one or two sentences for each situation.');
    writeBox(pg,'planb','1. If the photographer is sick, I\'ll…');
  }
  function pDream(pg){
    pg.insertAdjacentHTML('beforeend',`<div class="stick"><p class="label">Questions · 2nd conditional</p><div class="phr">
      <span>1. What would you change if you were the CEO?</span><span>2. What would you do if you had a free month?</span><span>3. Which city would you work from if you could choose any city?</span></div>
      <div class="starters"><span>If I were the CEO, I'd…</span><span>If I had a free month, I would…</span><span>If I could choose, I'd…</span></div></div>`);
    head(pg,'Dream mode','Now imagine! Answer the questions in 2–3 sentences each.');
    writeBox(pg,'dream','1. If I were the CEO, I\'d…');
  }

  const firstOk=(store,n,ans)=>{ let c=0; for(let i=0;i<n;i++) if(store[i]&&store[i].first===ans(i)) c++; return c; };
  function asText(){
    const L=[`Homework "What if…?" from Ira — ${new Date().toLocaleString('en-GB')}`,''];
    L.push(`REAL OR IMAGINARY: ${firstOk(st.sort,SORT.length,i=>SORT[i][1])}/${SORT.length} right first time`);
    SORT.forEach(([s,a],i)=>{ const r=st.sort[i]; L.push(`${i+1}. ${r?(r.first===a?'✓':'✗'):'–'} ${s} (${a?'2nd':'1st'})`); }); L.push('');
    const block=(title,items,store)=>{ L.push(`${title}: ${firstOk(store,items.length,i=>items[i].o[0])}/${items.length} right first time`);
      items.forEach((q,i)=>{ const r=store[i]; const full=q.t.includes('___')?q.t.replace('___',q.o[0].trim()):q.t+' — '+q.o[0];
        L.push(`${i+1}. ${r?(r.first===q.o[0]?'✓':'✗ '+r.first.trim()+' →'):'– (no answer)'} ${full}`); }); L.push(''); };
    block('LISTENING',LQ,st.listen); block('FIRST CONDITIONAL',C1,st.c1); block('SECOND CONDITIONAL',C2,st.c2);
    L.push(`MATCH THE HALVES: ${st.match.done.length}/${MATCH.length} matched, ${st.match.miss} mistakes`,'');
    L.push(`COMPLETE THE SENTENCES: ${firstOk(st.gaps,GAPS.length,i=>GAPS[i][1])}/${GAPS.length} right first time`);
    GAPS.forEach(([s,a],i)=>{ const r=st.gaps[i]; L.push(`${i+1}. ${r?(r.first===a?'✓':'✗ '+r.first+' →'):'– (no answer)'} ${s.replace('___',a)}`); }); L.push('');
    L.push(`BUILD THE SENTENCE: ${ORD.filter((_,i)=>st.ord[i]&&st.ord[i].ok).length}/${ORD.length} done`);
    ORD.forEach((w,i)=>{ const r=st.ord[i]; L.push(`${i+1}. ${r&&r.ok?'✓':'–'} ${w.join(' ')}${r&&r.tries?` (${r.tries} wrong tries)`:''}`); }); L.push('');
    L.push('PLAN B (1st conditional):',st.planb.trim()||'(empty)','');
    L.push('DREAM MODE (2nd conditional):',st.dream.trim()||'(empty)');
    return L.join('\n');
  }
  function pFinish(pg){
    const s=firstOk(st.sort,SORT.length,i=>SORT[i][1]), l=firstOk(st.listen,LQ.length,i=>LQ[i].o[0]), a=firstOk(st.c1,C1.length,i=>C1[i].o[0]), b=firstOk(st.c2,C2.length,i=>C2[i].o[0]), g=firstOk(st.gaps,GAPS.length,i=>GAPS[i][1]);
    pg.innerHTML=`<div class="hero"><span class="mono" style="color:var(--done)">DONE</span><h1>Great work, Ira!</h1></div>
      <div class="pills"><span class="pill">Real/imag. <b>${s}/6</b></span><span class="pill">Listening <b>${l}/6</b></span><span class="pill">1st <b>${a}/6</b></span><span class="pill">2nd <b>${b}/6</b></span><span class="pill">Halves <b>${st.match.done.length}/6</b></span><span class="pill">Gaps <b>${g}/8</b></span><span class="pill">Sentences <b>${ORD.filter((_,i)=>st.ord[i]&&st.ord[i].ok).length}/4</b></span></div>
      <p class="lead">Last step: copy your answers and send them to Tanya in a message.</p>
      <button type="button" class="big" id="copy">Copy my answers</button><p class="note" id="cnote" aria-live="polite"></p>
      <textarea class="copybox" id="cbox" readonly aria-label="Your answers"></textarea>
      <button type="button" class="sbtn" id="reset" style="justify-self:start">Start again</button>`;
    const box=pg.querySelector('#cbox'); box.value=asText();
    pg.querySelector('#copy').addEventListener('click',async e=>{ const btn=e.currentTarget; try{ await navigator.clipboard.writeText(box.value); btn.textContent='Copied ✓'; pg.querySelector('#cnote').textContent='Now paste it into your chat with Tanya.'; }
      catch(_){ box.focus(); box.select(); try{ box.setSelectionRange(0,box.value.length); }catch(__){} pg.querySelector('#cnote').textContent='The text is selected. Tap “Copy”, then paste it into your chat with Tanya.'; } });
    let armed=false; pg.querySelector('#reset').addEventListener('click',e=>{ if(!armed){ armed=true; e.currentTarget.textContent='Tap again to delete all answers'; return; }
      try{ localStorage.removeItem(KEY); }catch(_){} st=fresh(); save(); render(); });
  }

  render();
})();
</script>
